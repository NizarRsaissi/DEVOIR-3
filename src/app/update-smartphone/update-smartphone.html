<div class="container">
  <div>
    <h2>Modifier un Smartphone :</h2>
  </div>
  <form>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>ID Smartphone</label>
      <input readonly type="number" [(ngModel)]="currentSmartphone.idSmartphone" name="idSmartphone"
        class="form-control">
    </div>
    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Marque</label>
      <input type="text" [(ngModel)]="currentSmartphone.marque" name="marque" class="form-control">
    </div>
    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Modèle</label>
      <input type="text" [(ngModel)]="currentSmartphone.modele" name="modele" class="form-control">
    </div>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Prix</label>
      <input type="number" [(ngModel)]="currentSmartphone.prix" name="prix" class="form-control">
    </div>
    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Date de sortie</label>
      <input type="date" [ngModel]="currentSmartphone.dateSortie | date: 'yyyy-MM-dd'"
        (ngModelChange)="setDateSortie($event, currentSmartphone)" name="dateSortie" class="form-control">
    </div>
    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Stockage</label>
      <select class="form-control form-control-lg" id="idStock" name="idStock" [(ngModel)]="updatedStockId">
        @for(stock of stockages; track stock.idStock){
        <option [value]="stock.idStock"> {{stock.capaciteStock}} </option>
        }
      </select>
    </div>
    <div class="mt-2">
      <button type="submit" (click)="updateSmartphone()" class="btn btn-success">Modifier</button>
      <div>
        <h3></h3>
      </div>
    </div>
  </form>
</div>
